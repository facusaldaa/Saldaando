replicaCount: 1

image:
  repository: ghcr.io/facusaldaa/botgastospareja
  pullPolicy: Always
  # Use semantic versioning (e.g., "1.0.0", "1.0.1") or git commit SHA for rollback capability
  # Falls back to Chart.AppVersion if not set. Update this when deploying new versions.
  # Example: tag: "1.0.0" or tag: "v1.0.0" or tag: "abc1234"
  tag: "0.1.1" # Matches Chart.AppVersion - update when releasing new versions

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Environment variables are set in deployment.yaml template

persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: "/data"

nodeSelector: {}

tolerations: []

affinity: {}

secrets:
  telegramBotToken: "" # Base64 encoded token or plain text (will be encoded)

autoscaling:
  enabled: false
