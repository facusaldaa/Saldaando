replicaCount: 1

image:
  repository: ghcr.io/facusaldaa/botgastospareja
  pullPolicy: Always
  # Use semantic versioning (e.g., "1.0.0", "1.0.1") or git commit SHA for rollback capability
  # Falls back to Chart.AppVersion if not set. Update this when deploying new versions.
  # Example: tag: "1.0.0" or tag: "v1.0.0" or tag: "abc1234"
  tag: "latests" # Matches Chart.AppVersion - update when releasing new versions

imagePullSecrets: 
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Environment variables are set in deployment.yaml template

persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: "/data"

nodeSelector: {}

tolerations: []

affinity: {}

secrets:
  existingSecret: "botgastospareja-secrets"

# LLM Configuration for natural language expense parsing
llm:
  enabled: true
  glmModelName: "GLM-4-32B-0414-128K"
  glmBaseURL: "https://open.z.ai/api/paas/v4"
  glmTemperature: "0.3"
  glmFallbackToHF: "true"
  huggingfaceApiKey: false  # Set to true if you have a HuggingFace API key
  huggingfaceModel: "mistralai/Mistral-7B-Instruct-v0.2"

# Feature flags
features:
  enableCuotas: true

autoscaling:
  enabled: false
