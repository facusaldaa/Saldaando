name: Docker Build & Push
on:
  push:
    branches: [ main ] # This triggers the build whenever you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from Chart.yaml
        id: get_version
        run: |
          # Extract version using grep and sed
          VERSION=$(grep '^version:' helm/botgastospareja/Chart.yaml | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/facusaldaa/botgastospareja:latest
            ghcr.io/facusaldaa/botgastospareja:${{ steps.get_version.outputs.VERSION }}
