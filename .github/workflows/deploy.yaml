name: Docker Build & Push with Auto Version Bump

on:
  push:
    branches: [ main ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.NEW_VERSION }}
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check if version bump needed
        id: check
        run: |
          # Skip if commit message contains [skip-version]
          if git log -1 --pretty=%B | grep -q "\[skip-version\]"; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version bump skipped by commit message"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Bump patch version
        id: bump
        if: steps.check.outputs.changed == 'true'
        run: |
          CURRENT=$(grep '^version:' helm/botgastospareja/Chart.yaml | awk '{print $2}')
          # Increment patch version (1.0.3 -> 1.0.4)
          NEW=$(echo $CURRENT | awk -F. -v OFS=. '{$NF = $NF + 1; print}')
          echo "NEW_VERSION=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping version from $CURRENT to $NEW"
          
          # Update both version and appVersion in Chart.yaml
          sed -i "s/^version: .*/version: $NEW/" helm/botgastospareja/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$NEW\"/" helm/botgastospareja/Chart.yaml
      
      - name: Commit version bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/botgastospareja/Chart.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }} [skip-version]" || exit 0
          git push
      
      - name: Use current version
        if: steps.check.outputs.changed == 'false'
        run: |
          CURRENT=$(grep '^version:' helm/botgastospareja/Chart.yaml | awk '{print $2}')
          echo "NEW_VERSION=$CURRENT" >> $GITHUB_OUTPUT

  build-and-push:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # Get latest including version bump
      
      - name: Get version from Chart.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' helm/botgastospareja/Chart.yaml | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/facusaldaa/botgastospareja:latest
            ghcr.io/facusaldaa/botgastospareja:${{ steps.get_version.outputs.VERSION }}

  deploy:
    name: Deploy to k3s
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Get version from Chart.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' helm/botgastospareja/Chart.yaml | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update deployment image
        run: |
          kubectl set image deployment/botgastospareja \
            botgastospareja=ghcr.io/facusaldaa/botgastospareja:${{ steps.get_version.outputs.VERSION }} \
            -n bots
          kubectl rollout status deployment/botgastospareja -n bots --timeout=300s

      - name: Dump rollout logs on failure
        if: failure()
        run: kubectl logs deployment/botgastospareja -n bots --tail=50
